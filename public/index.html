<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><title>SAVOURY</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#172033}header{background:#0b1f3a;color:#fff;padding:16px;position:sticky;top:0;z-index:5}header b{font-size:24px;letter-spacing:1px}header span{float:left;color:#d7b55a}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #00000012}.gold{color:#b18b36}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:18px;border-radius:14px;background:#fff;border-right:4px solid #b18b36}.stat strong{font-size:25px;display:block;margin-top:8px}button{border:0;border-radius:10px;padding:11px 15px;background:#0b1f3a;color:#fff;margin:4px;cursor:pointer}button.alt{background:#b18b36}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:14px}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button{white-space:nowrap}.hidden{display:none}.login{max-width:420px;margin:12vh auto}.brand{font-size:42px;color:#0b1f3a;font-weight:bold}.err{color:#b3261e}.muted{color:#687386;font-size:13px}</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');let token=localStorage.sv_token,user=JSON.parse(localStorage.sv_user||'null');const modules=[['dashboard','الرئيسية'],['employees','الموظفون'],['inventory','المخازن'],['sales','المبيعات'],['purchases','المشتريات'],['content','محتوى الشركة'],['notifications','الإشعارات'],['reports','التحليلات والتقارير']];
function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(url,opt).then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.error||'Error');return x}))}
function login(){A.innerHTML=`<div class="wrap"><div class="login card"><div class="brand">SAVOURY</div><p class="gold">حلول متكاملة... جودة ترتقي بثقتكم</p><input id="u" placeholder="اسم المستخدم أو رقم الموظف"><input id="p" type="password" placeholder="كلمة المرور"><button class="alt" onclick="doLogin()">دخول</button><div id="e" class="err"></div><p class="muted">حساب المالك التجريبي: admin / admin123</p></div></div>`}
async function doLogin(){try{const x=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}).then(r=>r.json());if(!x.token)throw Error(x.error);token=x.token;user=x.user;localStorage.sv_token=token;localStorage.sv_user=JSON.stringify(user);render()}catch(e){document.getElementById('e').textContent=e.message}}
function render(){if(!token||!user)return login();A.innerHTML=`<header><b>SAVOURY</b><span>${user.name} — ${user.role}</span></header><div class="wrap"><div class="card"><b>مرحباً ${user.name}</b><div class="muted">${user.department||''} • ${user.site||'ALL'}</div></div><div class="nav">${modules.map(m=>`<button onclick="openMod('${m[0]}')">${m[1]}</button>`).join('')}<button onclick="logout()">خروج</button></div><main id="main"></main></div>`;openMod('dashboard')}
async function openMod(m){const main=document.getElementById('main');if(m==='dashboard'){const d=await api('/api/dashboard');main.innerHTML=`<h2>لوحة التحكم</h2><div class="grid"><div class="stat">مبيعات اليوم<strong>${d.sales}</strong></div><div class="stat">موظفون نشطون<strong>${d.employees}</strong></div><div class="stat">أصناف منخفضة<strong>${d.lowStock}</strong></div><div class="stat">محتوى منشور<strong>${d.publishedContent}</strong></div></div>`;return}if(m==='reports'){main.innerHTML='<div class="card"><h2>التحليلات والتقارير</h2><p>لوحة التقارير تعتمد على البيانات المركزية وتعرض مؤشرات المبيعات والمخزون والموظفين والمشتريات.</p><button onclick="openMod(\'sales\')">مبيعات</button><button onclick="openMod(\'inventory\')">مخزون</button></div>';return}const labels={employees:['الموظفون',['employee_no','name','department','position','site','salary','status']],inventory:['المخازن',['sku','item','site','qty','min_qty','unit']],sales:['المبيعات',['order_no','site','total','payment','date']],purchases:['المشتريات',['ref_no','site','total','supplier','date']],content:['محتوى الشركة',['type','title','body','status','scope']],notifications:['الإشعارات',['title','body','target']]};const [title,cols]=labels[m];const rows=await api('/api/'+m);let add='';if(m!=='notifications'||true)add=`<button class="alt" onclick="addRow('${m}',${JSON.stringify(cols)})">+ إضافة</button>`;main.innerHTML=`<div class="card"><h2>${title}</h2>${add}<div style="overflow:auto"><table><thead><tr>${cols.map(c=>'<th>'+c+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(c=>'<td>'+((r[c]??''))+'</td>').join('')+'</tr>').join('')}</tbody></table></div></div>`}
async function addRow(m,cols){const data={};for(const c of cols){let v=prompt('أدخل '+c);if(v===null)return;data[c]=v}try{await api('/api/'+m,{method:'POST',body:JSON.stringify(data)});openMod(m)}catch(e){alert(e.message)}}
function logout(){localStorage.clear();token=null;user=null;login()}render();
</script></body></html>
